version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-deps:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directories:
      - /
      - /docker
    schedule:
      interval: weekly
    ignore:
      # Go minor versions are bumped together with go.mod.
      - dependency-name: golang
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
