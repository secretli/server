name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default; the publish job requests what it needs.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The client the end-to-end job drives the server with.
  SECRETLI_CLI_VERSION: v0.4.0

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          args: ./...

      - name: Vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      # Zero knowledge means the server cannot hold a key, not merely that it
      # does not: the code that derives keys and decrypts must never be part
      # of it.
      - name: The server cannot decrypt
        run: |
          if go list -deps ./... | grep -q '^github.com/secretli/format'; then
            echo "github.com/secretli/format is in the server's dependencies; it must not be"
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Includes the Postgres and S3 integration tests, which start their
      # own containers.
      - run: go test -race -cover ./...

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Start Postgres and SeaweedFS
        run: |
          docker compose -f docker/docker-compose.yml up -d postgres seaweedfs
          for i in {1..60}; do
            if docker compose -f docker/docker-compose.yml exec -T postgres pg_isready -U secretli >/dev/null; then
              break
            fi
            sleep 1
          done
          for i in {1..60}; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --aws-sigv4 'aws:amz:us-east-1:s3' --user 'admin:admin' -X PUT http://localhost:8333/secretli || true)
            if [ "$code" = "200" ] || [ "$code" = "409" ]; then
              exit 0
            fi
            sleep 1
          done
          docker compose -f docker/docker-compose.yml logs
          exit 1

      - name: Start the server
        env:
          DATABASE_URL: postgres://secretli:secretli@localhost:5432/secretli?sslmode=disable
          S3_ENDPOINT: localhost:8333
          S3_BUCKET: secretli
          S3_ACCESS_KEY: admin
          S3_SECRET_KEY: admin
          S3_USE_SSL: "false"
          S3_REGION: us-east-1
          SERVER_PORT: "8080"
          # The API test sends more requests from one address than the
          # limits allow; the real limits are checked by the unit tests.
          RATE_LIMIT_MULTIPLIER: "100"
        run: |
          go build -o bin/secretli-e2e .
          ./bin/secretli-e2e > secretli-e2e.log 2>&1 &
          echo $! > secretli-e2e.pid
          for i in {1..60}; do
            if curl -fsS http://localhost:8080/api/v1/health/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat secretli-e2e.log
          exit 1

      - name: API test
        env:
          SECRETLI_SERVER: http://localhost:8080
        run: go test -count=1 -race -v ./apitest

      - name: Install the command-line client
        run: GOBIN="$RUNNER_TEMP/bin" go install "github.com/secretli/cli/cmd/secretli@${SECRETLI_CLI_VERSION}"

      - name: End-to-end
        env:
          SECRETLI_SERVER: http://localhost:8080
        run: SECRETLI_CLI="$RUNNER_TEMP/bin/secretli" ./scripts/e2e.sh

      - name: Server logs
        if: always()
        run: |
          cat secretli-e2e.log || true
          docker compose -f docker/docker-compose.yml logs postgres seaweedfs || true

      - name: Stop services
        if: always()
        run: |
          if [ -f secretli-e2e.pid ]; then kill "$(cat secretli-e2e.pid)" || true; fi
          docker compose -f docker/docker-compose.yml down -v

  build-and-publish:
    needs: [lint, test, e2e]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signature
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The date-sha tag is what Flux's image automation orders by.
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value={{date 'YYYYMMDD-HHmmss'}}-{{sha}}

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          images=""
          for tag in $TAGS; do
            images="$images ${tag}@${DIGEST}"
          done
          cosign sign --yes $images
